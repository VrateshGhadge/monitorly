<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO. Canonical is the production apex origin; per-route values
         are managed at runtime by SeoManager (src/components/app/SeoManager.tsx). -->
    <title>Monitorly — Website &amp; API Monitoring with Instant Alerts</title>
    <meta
      name="description"
      content="Monitorly checks your websites and APIs every five minutes and emails you the moment something breaks. Reliable uptime monitoring with instant alerts."
    />
    <link rel="canonical" href="https://monitorly.live/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0b0d10" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, Discord…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Monitorly" />
    <meta property="og:url" content="https://monitorly.live/" />
    <meta
      property="og:title"
      content="Monitorly — Website &amp; API Monitoring with Instant Alerts"
    />
    <meta
      property="og:description"
      content="Monitorly checks your websites and APIs every five minutes and emails you the moment something breaks. Reliable uptime monitoring with instant alerts."
    />
    <meta property="og:image" content="https://monitorly.live/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Monitorly — website and API monitoring with instant alerts"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Monitorly — Website &amp; API Monitoring with Instant Alerts"
    />
    <meta
      name="twitter:description"
      content="Monitorly checks your websites and APIs every five minutes and emails you the moment something breaks. Reliable uptime monitoring with instant alerts."
    />
    <meta name="twitter:image" content="https://monitorly.live/og-image.png" />

    <!-- Warm the connection to Google Identity Services during HTML parse. The
         sign-in button is a cross-origin iframe, so DNS + TLS to
         accounts.google.com sit directly on its critical path. -->
    <link rel="preconnect" href="https://accounts.google.com" />
    <link rel="dns-prefetch" href="https://accounts.google.com" />
    <!-- Start downloading GSI alongside the app bundle. The button cannot
         render until this script + its iframe load, so fetching it after React
         mounts serializes 3+ round trips behind first paint. -->
    <script src="https://accounts.google.com/gsi/client" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
